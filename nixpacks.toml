[providers]
php = true
node = true

[phases.setup]
nixPkgs = ["pkgs.nodejs", "pkgs.npm"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm ci || npm install",
  "npm run build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php -S 0.0.0.0:${PORT} -t public"

